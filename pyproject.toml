[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tr-tarih"
version = "0.1.0"
description = "Parse and format Turkish dates, times, numbers and lira amounts offline"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Yusuf Berat Zengin"}]
keywords = ["turkish", "dates", "datetime", "numbers", "lira", "cli", "parser", "offline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.11", "mypy>=1.10", "build>=1.2", "twine>=6"]

[project.urls]
Homepage = "https://github.com/YusufBeratZengin/tr-tarih#readme"
Repository = "https://github.com/YusufBeratZengin/tr-tarih"
Issues = "https://github.com/YusufBeratZengin/tr-tarih/issues"
Changelog = "https://github.com/YusufBeratZengin/tr-tarih/blob/main/CHANGELOG.md"

[project.scripts]
tr-tarih = "tr_tarih.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/tr_tarih"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "scripts", "docs", "*.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider --cov=tr_tarih --cov-branch --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["tr_tarih"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["pytest-cache-files-*", "is"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
